<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO-APP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <div>Kanban</div>
        <div><button id="newtask">Add New Task</button></div>
      </nav>
      <section class="board">
        <div id="todo" class="task-column">
          <div class="heading">
            <div class="left">TODO</div>
            <div class="right">count</div>
          </div>
          </div>
        <div id="progress" class="task-column">
          <div class="heading">
            <div class="left">PROGRESS</div>
            <div class="right">count</div>
          </div>
        </div>
        <div id="done" class="task-column">
          <div class="heading">
            <div class="left">DONE</div>
            <div class="right">count</div>
          </div>
        </div>
      </section>
    </main>
    
    <script src="script.js"></script>
  </body>
</html>
